<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:">
<title>CodeSpace</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:transparent;-webkit-user-select:none;user-select:none;-webkit-app-region:drag;
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:#f3f8ff}
  .card{box-sizing:border-box;height:100%;margin:0;border-radius:18px;border:1px solid rgba(70,160,255,.35);
    background:radial-gradient(ellipse at 50% 34%,#102b55 0%,#07172e 52%,#040b17 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px 20px 16px;text-align:center;animation:in .5s ease both}
  .logo{width:56px;height:56px;animation:glow 1.7s ease-in-out infinite alternate}
  .logo .hex{stroke-dasharray:300;stroke-dashoffset:300;animation:draw 1.3s ease forwards}
  h1{margin:2px 0 0;font-size:28px;font-weight:760;letter-spacing:-.04em;
    background:linear-gradient(90deg,#fff,#8fd6ff 55%,#4aa8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .msg{margin:6px 0 0;width:100%;box-sizing:border-box;padding:9px 12px;border:1px solid rgba(70,160,255,.48);border-radius:12px;
    background:rgba(20,100,190,.12);font-size:14px;font-weight:700;color:#dceeff}
  .bar{width:100%;height:3px;border-radius:3px;background:rgba(70,160,255,.18);overflow:hidden;margin-top:2px}
  .bar i{display:block;width:40%;height:100%;border-radius:3px;background:linear-gradient(90deg,#65e2ff,#2764ff);animation:slide 1.2s ease-in-out infinite}
  .foot{margin:6px 0 0;font-size:11px;color:#8fb3d9;letter-spacing:.01em}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes glow{from{filter:drop-shadow(0 0 6px rgba(0,135,255,.4));transform:scale(.97)}to{filter:drop-shadow(0 0 14px rgba(60,190,255,.8));transform:scale(1.03)}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.logo .hex{stroke-dashoffset:0}}
</style>
</head>
<body>
  <div class="card" role="status" aria-live="polite">
    <svg class="logo" viewBox="0 0 100 100" role="img" aria-label="CodeSpace logo">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#65e2ff"/><stop offset=".52" stop-color="#1e9bff"/><stop offset="1" stop-color="#2764ff"/></linearGradient></defs>
      <path class="hex" d="M65 12H35L12 35v30l23 23h30l23-23V35z" fill="rgba(20,100,190,.12)" stroke="url(#g)" stroke-width="5" stroke-linejoin="round"/>
      <path d="m40 38-12 12 12 12M60 38l12 12-12 12M55 32 45 68" fill="none" stroke="url(#g)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>CodeSpace</h1>
    <div class="msg">Setup Your Workspace......</div>
    <div class="bar"><i></i></div>
    <p class="foot">© CodeSpace · Developer: Rabiul Islam</p>
  </div>
</body>
</html>
