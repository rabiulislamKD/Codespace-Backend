<!doctype html>
<html><head><meta charset="utf-8"><title>CodeSpace Bridge</title>
<style>
  body{font:13px/1.45 system-ui,"Segoe UI",sans-serif;width:340px;margin:0;padding:12px;color:#202124}
  h1{font-size:15px;margin:0 0 8px} label{display:block;margin:8px 0 3px;font-size:12px;color:#5f6368}
  input[type=text],input[type=password]{width:100%;box-sizing:border-box;padding:5px 7px;border:1px solid #dadce0;border-radius:4px}
  button{padding:5px 10px;border:1px solid #dadce0;border-radius:4px;background:#fff;cursor:pointer} button.primary{background:#1a73e8;border-color:#1a73e8;color:#fff} button.danger{color:#d93025}
  .row{display:flex;gap:6px;align-items:center;margin-top:8px} .sp{flex:1}
  #status{margin:6px 0;padding:6px 8px;border-radius:4px;background:#f1f3f4} #status.ok{background:#e6f4ea;color:#137333} #status.bad{background:#fce8e6;color:#c5221f}
  ul{margin:4px 0;padding:0;list-style:none} li{display:flex;gap:6px;align-items:center;padding:3px 0;border-bottom:1px solid #eee} li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hint{font-size:11px;color:#5f6368;margin-top:8px}
</style></head><body>
<h1>CodeSpace Bridge</h1>
<div id="status">Checking…</div>
<label for="url">Bridge address</label><input id="url" type="text" spellcheck="false">
<label for="token">Bridge token (printed when agent-server.js starts)</label><input id="token" type="password" autocomplete="off" spellcheck="false">
<div class="row"><label style="margin:0;display:flex;gap:6px;align-items:center"><input id="enabled" type="checkbox"> Allow the agent to use Chrome</label><span class="sp"></span><button id="save" class="primary">Save</button></div>
<div class="row"><button id="share">Share this tab</button><span class="sp"></span><button id="stop" class="danger">Stop all</button></div>
<label>Tabs the agent can control</label><ul id="tabs"></ul>
<div class="hint">The agent can only act on tabs it opened or tabs you share here. It cannot read cookies or saved passwords, and it stops at bot-check pages.</div>
<script src="popup.js"></script>
</body></html>
